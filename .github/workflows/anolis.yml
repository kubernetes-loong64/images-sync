name: Sync openanolis/anolisos

on:
  schedule:
    - cron: '23 7 * * 2'
  workflow_dispatch:
    inputs:
      source_image:
        description: 'source image (e.g. openanolis/anolisos)'
        required: true
        type: string
        default: 'openanolis/anolisos'
      source_tag:
        description: 'source image tag'
        required: true
        type: string
        default: '23.4'
      target_name:
        description: 'target image name'
        required: false
        type: string
        default: 'anolisos'

env:
  NAMESPACE: ${{ vars.NAMESPACE || 'kubernetesloong64' }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.platform.outputs.platform }}
    steps:
      - name: docker info
        run: docker info

      - name: env
        id: env
        run: |
          IMAGE="${{ inputs.source_image }}:${{ inputs.source_tag }}"
          echo "IMAGE=$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: platform
        id: platform
        run: |
          PLATFORM=$(docker manifest inspect "$IMAGE" | jq -rc 'if .manifests then [.manifests[].platform.architecture | select(. != "unknown")] else ["amd64"] end')
          echo "platform=$PLATFORM"
          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.matrix.outputs.platform) }}

    steps:
      - name: docker login ${{ vars.SYNC_REGISTRY }}
        run: |
          echo "${{ secrets.SYNC_REGISTRY_PASSWORD }}" | docker login "${{ vars.SYNC_REGISTRY }}" --username "${{ vars.SYNC_REGISTRY_USERNAME }}" --password-stdin

      - name: env
        run: |
          TAG="${{ inputs.source_tag }}"
          IMAGE="${{ inputs.source_image }}:$TAG"
          TARGET_NAME="${{ inputs.target_name }}"
          TARGET_IMAGE="${{ vars.SYNC_REGISTRY }}/${{ env.NAMESPACE }}/$TARGET_NAME:$TAG"

          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "TARGET_IMAGE=$TARGET_IMAGE" >> $GITHUB_ENV

      - name: docker pull ${{ matrix.platform }}
        run: |
          docker images
          docker pull --platform=linux/${{ matrix.platform }} "$IMAGE"
          docker images

      - name: docker tag
        run: |
          docker tag "$IMAGE" "$TARGET_IMAGE-${{ matrix.platform }}"
          docker images

      - name: docker push
        run: |
          docker push "$TARGET_IMAGE-${{ matrix.platform }}"

  merge:
    needs: [ matrix, build ]
    runs-on: ubuntu-latest
    steps:
      - name: docker login ${{ vars.SYNC_REGISTRY }}
        run: |
          echo "${{ secrets.SYNC_REGISTRY_PASSWORD }}" | docker login "${{ vars.SYNC_REGISTRY }}" --username "${{ vars.SYNC_REGISTRY_USERNAME }}" --password-stdin

      - name: env
        run: |
          TAG="${{ inputs.source_tag }}"
          TARGET_NAME="${{ inputs.target_name }}"
          TARGET_IMAGE="${{ vars.SYNC_REGISTRY }}/${{ env.NAMESPACE }}/$TARGET_NAME:$TAG"

          echo "TARGET_IMAGE=$TARGET_IMAGE" >> $GITHUB_ENV

      - name: docker manifest create
        run: |
          IMAGES=""
          for arch in $(echo '${{ needs.matrix.outputs.platform }}' | jq -r '.[]'); do
            IMAGES="$IMAGES $TARGET_IMAGE-$arch"
          done
          docker manifest create $TARGET_IMAGE $IMAGES

      - name: docker manifest push
        run: |
          docker manifest push "$TARGET_IMAGE"
